# Own configuration for this project's tests.
#
# Having a pytest.ini here makes this folder the pytest rootdir when these tests
# are run (`pytest tests/photocraft`), so upstream's tests/conftest.py is not
# loaded. That matters because upstream's conftest creates a QCoreApplication at
# import time, and the Qt mirror tests need a QApplication (widgets) instead.
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = module
timeout = 60
